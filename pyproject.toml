[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conflict_eval"
version = "0.1.0"
description = "Pilot study: parametric preference strength and source preference in LLM evidence use."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.19",
    "accelerate>=0.30",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

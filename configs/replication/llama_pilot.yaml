# Llama-3.1-8B-Instruct replication pilot configuration.
#
# STATUS: precommitted specification, PRE-RUN. No Llama scientific result
# exists yet — see docs/llama_replication_protocol.md for the full
# protocol and docs/decisions.md, "Precommit the Llama second-model
# replication" for the rationale.
#
# This is a replication of the frozen Qwen2.5-7B-Instruct pilot's METHOD
# (docs/qwen_pilot_results.md), not a copy of its realized sample. Every
# value below that the Qwen pilot also used unchanged (seed, dataset
# snapshot, candidate frame, target counts, margin bins) is intentionally
# identical, so the two models see the same precommitted method. Every
# value that must be independently measured for Llama (source roles) is
# left null here and MUST be set by the researcher only after inspecting
# that model's own calibration output — never copied from Qwen.

seed: 42

dataset:
  hf_dataset_id: akariasai/PopQA
  split: test
  # Exact immutable PopQA snapshot used by the frozen Qwen pilot
  # (docs/qwen_pilot_results.md, "Frozen provenance"). Pinning the same
  # revision here (via the generic dataset.revision config option — see
  # docs/decisions.md, "Add generic dataset revision propagation") gives
  # both models the same underlying data snapshot to sample from.
  revision: 098765c79ea10a2cb19c828324e33281b8336ec0
  screening_candidates: 500
  candidate_pool: primary_conflict_relations

# Isolated path namespace so Llama's own baseline/calibration/pilot
# artifacts can never be confused with or accidentally overwrite the
# frozen Qwen run's paths under data/, results/, figures/. This directory
# is regenerated by running the pipeline, never hand-edited, and is
# git-ignored in full (see .gitignore, "runs/").
paths:
  raw_dir: runs/llama/data/raw
  interim_dir: runs/llama/data/interim
  processed_dir: runs/llama/data/processed
  results_dir: runs/llama/results
  figures_dir: runs/llama/figures

sampling:
  target_kc_items: 30
  target_kw_items: 30
  margin_bins: [low, medium, high]

models:
  - llama

# Llama's own source roles are UNKNOWN and must not be assumed from
# Qwen's measured pair (government website preferred / anonymous forum
# post dispreferred — docs/qwen_pilot_results.md). They remain null until
# the researcher inspects Llama's own independent calibration output and
# records a defensible choice (docs/pilot_protocol.md, step 6;
# docs/llama_replication_protocol.md, Phase F/G). build-pilot refuses to
# run while these are unset.
source_roles:
  llama:
    preferred_source: null
    dispreferred_source: null

prompts_config: configs/prompts.yaml
sources_config: configs/sources.yaml
models_config: configs/replication/models_llama.yaml
